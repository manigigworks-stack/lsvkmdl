<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15130F">
<title>LS — Daily usage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#15130F; --surface:#201D18; --surface2:#2A261F; --line:#3A342B;
  --text:#F4EFE6; --dim:#B5AC9C; --faint:#9C9384;
  --gold:#F2B33D; --ink:#1F1606; --mint:#6FD3A4; --coral:#FF8F73;
  --num:'Space Grotesk','Hind Madurai',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
html{background:#0E0C09}
body{margin:0;color:var(--text);font-family:'Hind Madurai',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:640px){
  .app{margin:24px auto;height:min(900px,calc(100vh - 48px));border-radius:32px;box-shadow:0 0 0 1px #2A261F,0 30px 80px rgba(0,0,0,.5)}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* header */
.top{flex:none;padding:20px 20px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:4px}
.eyebrow i{width:8px;height:8px;border-radius:99px;background:var(--gold)}
.top > .eyebrow{flex:1 0 100%;margin-bottom:0}
h1{margin:0;font-family:var(--num);font-size:26px;font-weight:600;line-height:1.1}
.ta-sub{margin:0;font-size:15px;color:var(--dim)}
.date{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.date:focus-within{box-shadow:inset 0 0 0 2px var(--gold)}
.date input{border:0;outline:0;background:transparent;color:var(--text);font-family:var(--num);font-size:15px;padding:8px 0;min-height:40px}
.date input::-webkit-calendar-picker-indicator{filter:invert(.8);cursor:pointer}

/* page chips */
.chips{flex:none;display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:48px;padding:4px 14px;border:0;border-radius:14px;background:var(--surface);color:var(--dim);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.2}
.chip b{font-size:14px;font-weight:600;white-space:nowrap}
.chip small{font-size:12px;white-space:nowrap}
.chip[aria-selected="true"]{background:var(--gold);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* rows (top half, scrolls) */
.list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 8px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;flex-direction:column;gap:6px;flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:62px;padding:8px 16px;border:0;border-radius:14px;background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.row:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.row[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold);background:#2A2416}
.row.bad{box-shadow:inset 0 0 0 2px var(--coral)}
.lab{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.lab b{font-size:15px;font-weight:600}
.lab small{font-size:13px;color:var(--dim)}
.fig{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;flex:none}
.amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;white-space:nowrap}
.amt .u{font-family:'Hind Madurai',system-ui,sans-serif;font-size:13px;font-weight:600;color:var(--dim);margin-left:4px}
.amt.empty{color:var(--faint);font-weight:500}
.prev{font-family:var(--num);font-size:13px;color:var(--faint);white-space:nowrap}
.units{font-family:var(--num);font-size:13px;font-weight:600;color:var(--mint);white-space:nowrap}
.units.hi,.units.low{color:var(--coral)}
.caret{display:inline-block;width:2px;height:20px;margin-left:2px;background:var(--gold);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.note{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--coral)}
.note span{flex:none;font-size:13px;font-weight:600;color:var(--dim)}
.note input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;padding:10px 0}
.msg{padding:14px 16px;border-radius:14px;background:var(--surface);color:var(--dim)}

/* keypad (bottom, fixed) */
.bottom{flex:none;border-top:1px solid var(--surface2);background:var(--bg);padding:10px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:"k1 k2 k3 del" "k4 k5 k6 same" "k7 k8 k9 nxt" "k0 k0 dot nxt";gap:8px}
.key{min-height:52px;border:0;border-radius:14px;background:var(--surface2);color:var(--text);font-family:var(--num);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.key:active{background:var(--line)}
.key:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.key:disabled{opacity:.4;cursor:default}
.key.fn{font-family:'Hind Madurai',system-ui,sans-serif;font-size:15px;font-weight:600;color:var(--dim)}
.key.next{background:var(--surface);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold);flex-direction:column;gap:2px}
.save{min-height:56px;border:0;border-radius:16px;background:var(--gold);color:var(--ink);font:inherit;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.save:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.save:active{transform:translateY(1px)}

/* saved view */
.done{flex:1;min-height:0;overflow-y:auto;padding:28px 20px 20px;display:flex;flex-direction:column;gap:14px}
.done-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tick{width:88px;height:88px;border-radius:99px;background:#1C3329;box-shadow:0 0 0 10px rgba(111,211,164,.08);color:var(--mint);display:flex;align-items:center;justify-content:center;animation:pop .5s ease-out both}
.tick path{stroke-dasharray:24;animation:draw .45s .3s ease-out both}
.done h2{margin:0;font-family:var(--num);font-size:26px;font-weight:600;outline:none}
.card{background:var(--surface);border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;animation:rise .4s .3s ease-out both}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3 small{font-weight:500;color:var(--dim);font-size:13px}
.c-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--surface2);font-size:15px}
.c-row .k{color:var(--dim);font-size:14px}
.c-row .v{text-align:right}
.c-row .v small{display:block;font-size:12px;color:var(--mint)}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border:0;border-radius:16px;background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line);font:inherit;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* PIN screen, Home / Lock */
.app.pin-on > :not(#pinView):not(.sr){display:none !important}
.app:not(.pin-on) > #pinView{display:none !important}
.pin{padding:28px 20px 28px;display:flex;flex-direction:column;gap:22px;flex:1;overflow-y:auto}
.pin-top{display:flex;flex-direction:column;gap:2px}
.pin-top h1{font-size:30px}
.pin-top .ta-sub{font-size:17px}
.dots{display:flex;gap:14px;justify-content:center;margin-top:10px}
.dot{width:16px;height:16px;border-radius:99px;border:2px solid var(--faint);background:transparent}
.dot.on{background:var(--gold);border-color:var(--gold)}
.dots.wrong .dot{border-color:var(--coral)}
@media (prefers-reduced-motion:no-preference){
  .dots.wrong{animation:shake .35s ease-in-out}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
}
.pin-msg{margin:0;min-height:1.45em;text-align:center;font-size:15px;color:var(--dim)}
.pin-msg.bad{color:var(--coral);font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.pkey{height:64px;border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--text);font-family:var(--num);font-size:26px;font-weight:600;cursor:pointer;touch-action:manipulation}
.pkey.word{font-family:inherit;font-size:16px}
.pkey:active{background:var(--surface2)}
.pkey:disabled{opacity:.5;cursor:default}
.pkey:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.me{margin-left:auto;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.me + .lockbtn{margin-left:10px}
.lockbtn + .lockbtn{margin-left:0}
a.lockbtn{display:inline-flex;align-items:center;text-decoration:none}
.lockbtn{flex:none;margin-left:auto;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.lockbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.save-err{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--coral)}
.save-err:empty{display:none}
.btn:disabled,.save:disabled{opacity:.6;cursor:progress}

</style>
</head>
<body>
<div class="app pin-on">

<section class="pin" id="pinView" aria-labelledby="pinTitle">
  <header class="pin-top">
    <div class="eyebrow"><i aria-hidden="true"></i>LS · Usage<a class="lockbtn homelink" href="index.html">Home</a></div>
    <h1 id="pinTitle">Enter your PIN</h1>
    <p class="ta-sub" lang="ta">உங்கள் PIN எண்</p>
  </header>
  <div class="dots" id="dots" aria-hidden="true">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>
  <p class="pin-msg" id="pinMsg" role="status" aria-live="polite"></p>
  <div class="keypad">
    <button type="button" class="pkey" data-key="1">1</button>
    <button type="button" class="pkey" data-key="2">2</button>
    <button type="button" class="pkey" data-key="3">3</button>
    <button type="button" class="pkey" data-key="4">4</button>
    <button type="button" class="pkey" data-key="5">5</button>
    <button type="button" class="pkey" data-key="6">6</button>
    <button type="button" class="pkey" data-key="7">7</button>
    <button type="button" class="pkey" data-key="8">8</button>
    <button type="button" class="pkey" data-key="9">9</button>
    <button type="button" class="pkey word" data-key="clear">Clear</button>
    <button type="button" class="pkey" data-key="0">0</button>
    <button type="button" class="pkey word" data-key="back" aria-label="Delete last digit">⌫</button>
  </div>
</section>

<header class="top" id="head">
  <div class="eyebrow"><i aria-hidden="true"></i>LS · Usage<span class="me" id="whoName"></span><a class="lockbtn homelink" href="index.html">Home</a><button type="button" class="lockbtn" id="lockBtn">Lock</button></div>
  <div>
    <h1>Daily usage</h1>
    <p class="ta-sub" lang="ta">தினசரி பயன்பாடு</p>
  </div>
  <label class="date"><span class="sr">Date</span><input id="day" type="date"></label>
</header>

<div class="chips" id="chips" role="tablist" aria-label="Page"></div>

<div class="list" id="list" role="tabpanel" aria-label="Usage"></div>

<div class="bottom" id="bottom">
  <div class="pad" id="pad">
    <button type="button" class="key" style="grid-area:k1" data-k="1">1</button>
    <button type="button" class="key" style="grid-area:k2" data-k="2">2</button>
    <button type="button" class="key" style="grid-area:k3" data-k="3">3</button>
    <button type="button" class="key fn" style="grid-area:del" data-k="del" aria-label="Delete last digit">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11v12H9l-6-6 6-6z"></path><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"></path></svg>
    </button>
    <button type="button" class="key" style="grid-area:k4" data-k="4">4</button>
    <button type="button" class="key" style="grid-area:k5" data-k="5">5</button>
    <button type="button" class="key" style="grid-area:k6" data-k="6">6</button>
    <button type="button" class="key fn" style="grid-area:same" data-k="same" aria-label="Same as yesterday">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>
      Same
    </button>
    <button type="button" class="key" style="grid-area:k7" data-k="7">7</button>
    <button type="button" class="key" style="grid-area:k8" data-k="8">8</button>
    <button type="button" class="key" style="grid-area:k9" data-k="9">9</button>
    <button type="button" class="key fn next" style="grid-area:nxt" data-k="next" aria-label="Next row">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M6 13l6 6 6-6"></path></svg>
      Next
    </button>
    <button type="button" class="key" style="grid-area:k0" data-k="0">0</button>
    <button type="button" class="key" style="grid-area:dot" data-k="." id="dotKey">.</button>
  </div>
  <p class="save-err" id="saveErr" role="alert"></p>
  <button type="button" class="save" id="saveBtn"><span id="saveText">Save usage</span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
  </button>
</div>

<section class="done" id="done" hidden aria-labelledby="doneTitle">
  <div class="done-head">
    <div class="tick" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </div>
    <h2 id="doneTitle" tabindex="-1">Usage saved</h2>
    <p class="ta-sub" lang="ta">சேமிக்கப்பட்டது</p>
  </div>
  <div class="card"><div class="c-row" style="border-top:0"><span class="k">Date</span><span class="num" id="dDate"></span></div></div>
  <div id="dPages" style="display:flex;flex-direction:column;gap:14px"></div>
  <button type="button" class="btn" id="editBtn">Edit</button>
  <a class="btn homelink" href="index.html">Home</a>
</section>

<p class="sr" id="live" aria-live="polite"></p>
</div>

<script src="config.js"></script>
<script>
const API_URL = (window.LS_CONFIG && window.LS_CONFIG.apiUrl) || 'PASTE-EXEC-LINK';   // set in config.js
</script>
<script>
/* ---------- PIN, login from the home screen, and the link to the sheet ---------- */
// The home screen (index.html) keeps the PIN for this browser tab only, so this page opens without asking again.
// It is cleared by Lock, by closing the tab, or after 12 hours.
var LS = (function () {
  var MOCK = window.__LS_MOCK__ || null;   // preview only (designs/*-preview.html)
  var API_READY = !!MOCK || /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(API_URL);
  var SESSION_KEY = 'ls-session', SESSION_HOURS = 12, PIN_LENGTH = 6;
  var app = document.querySelector('.app');
  var pinView = document.getElementById('pinView');
  var pin = '', typed = '', busy = false, cfg = null;
  function el(id) { return document.getElementById(id); }
  try { localStorage.removeItem('ls-coconut-pin'); localStorage.removeItem('ls-owner-pin'); } catch (e) {}

  function readSession() {
    try {
      var s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
      if (s && s.pin && s.until > Date.now()) return s;
      sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {}
    return null;
  }
  function writeSession(p, who) {
    try {
      var old = readSession(), same = old && old.pin === p;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        pin: p, name: who.name, role: who.role,
        pages: same ? (old.pages || []) : [],
        until: same ? old.until : Date.now() + SESSION_HOURS * 3600 * 1000
      }));
    } catch (e) {}
  }
  function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }

  // Sends a request to the Apps Script and returns its data. No Google sign-in is sent.
  async function call(action, payload) {
    var body = Object.assign({ action: action, pin: pin }, payload || {});
    if (MOCK) { await new Promise(function (r) { setTimeout(r, 250); }); return MOCK(body); }
    if (!API_READY) throw new Error('This page is not connected yet: add the Apps Script link in config.js.');
    var res;
    try {
      var r = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        credentials: 'omit',
        redirect: 'follow'
      });
      res = await r.json();
    } catch (e) {
      throw new Error('Could not reach the sheet. Check the internet and try again.');
    }
    if (!res || res.ok !== true) throw new Error((res && res.error) || 'Something went wrong. Try again.');
    return res.data;
  }
  function errText(err) {
    var m = (err && err.message) ? err.message : String(err || '');
    return m.replace(/^(Exception|Error):\s*/i, '') || 'Something went wrong. Try again.';
  }
  function isPinError(err) { return /PIN/.test(errText(err)); }

  function setMsg(t, bad) { var m = el('pinMsg'); m.textContent = t; m.classList.toggle('bad', !!bad); }
  function renderDots() { pinView.querySelectorAll('.dot').forEach(function (d, i) { d.classList.toggle('on', i < typed.length); }); }
  function setKeys(on) { pinView.querySelectorAll('.pkey').forEach(function (k) { k.disabled = !on; }); }
  function shake() { var d = el('dots'); d.classList.remove('wrong'); void d.offsetWidth; d.classList.add('wrong'); }

  function press(k) {
    if (busy) return;
    if (k === 'back') typed = typed.slice(0, -1);
    else if (k === 'clear') typed = '';
    else if (typed.length < PIN_LENGTH) typed += k;
    el('dots').classList.remove('wrong');
    setMsg('');
    renderDots();
    if (typed.length === PIN_LENGTH) tryPin(typed);
  }

  async function tryPin(p, quiet) {
    busy = true; setKeys(false); setMsg(quiet ? 'Opening…' : 'Checking…');
    try {
      var me = await call('login', { pin: p, page: cfg.page });
      pin = p;
      writeSession(p, me);
      typed = ''; renderDots(); setMsg('');
      el('whoName').textContent = me.name || '';
      app.classList.remove('pin-on');
      window.scrollTo(0, 0);
      if (cfg.onLogin) cfg.onLogin(me);
    } catch (err) {
      typed = ''; renderDots();
      if (!quiet) shake();
      if (/Wrong PIN/.test(errText(err))) clearSession();
      setMsg(errText(err), true);
    } finally {
      busy = false; setKeys(true);
    }
  }

  function lockOut(message) {
    pin = ''; typed = ''; renderDots();
    app.classList.add('pin-on');
    setMsg(message || '', true);
    window.scrollTo(0, 0);
  }
  // Call from a page's catch: returns true when the error was about the PIN and the PIN screen is shown.
  function handle(err) {
    if (!isPinError(err)) return false;
    if (/Wrong PIN/.test(errText(err))) clearSession();
    lockOut(errText(err));
    return true;
  }

  pinView.querySelectorAll('.pkey').forEach(function (b) { b.addEventListener('click', function () { press(b.dataset.key); }); });
  document.addEventListener('keydown', function (e) {
    if (!app.classList.contains('pin-on')) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
    else if (e.key === 'Escape') press('clear');
  });
  el('lockBtn').addEventListener('click', function () {
    clearSession();
    if (MOCK) { lockOut('Locked. Enter your PIN to continue.'); return; }   // the preview has no home screen next to it
    window.location.href = 'index.html';
  });
  if (MOCK) document.querySelectorAll('.homelink').forEach(function (a) { a.href = window.__LS_HOME__ || '#'; });

  function start(c) {
    cfg = c;
    if (!API_READY) { setKeys(false); setMsg('This page is not connected yet: add the Apps Script link in config.js.', true); return; }
    var s = readSession();
    if (s) tryPin(s.pin, true);
  }

  return { start: start, call: call, errText: errText, handle: handle, locked: function () { return app.classList.contains('pin-on'); } };
})();

(function () {
  var $ = function (id) { return document.getElementById(id); };

  var COCO = [
    { key: 'coco:used', en: 'Coconuts used', ta: 'பயன்படுத்திய தேங்காய்', unit: 'nos', field: 'used' },
    { key: 'coco:damaged', en: 'Coconuts damaged', ta: 'சேதமான தேங்காய்', unit: 'nos', field: 'damaged' },
    { key: 'coco:shell', en: 'Shell weight', ta: 'தேங்காய் ஓடு எடை', unit: 'kg', field: 'shellKg' }
  ];
  var RESET = /reset|replac|ரீசெட்|மாற்ற/i;

  var pages = [];     // [{ key, en, ta, rows: [row] }] — only pages with rows
  var vals = {};      // row key -> typed text
  var notes = {};     // meter id -> note
  var cur = 0, sel = 0, fresh = true;
  var loading = false, saving = false, ready = false, loadSeq = 0;

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  var now = new Date();
  var todayStr = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());
  $('day').max = todayStr;
  $('day').value = todayStr;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtNum(n) { return Number(n).toLocaleString('en-IN', { maximumFractionDigits: 3 }); }
  function fmtRaw(s) {   // keeps a trailing "." while typing
    var p = String(s).split('.');
    var whole = p[0] === '' ? '0' : Number(p[0]).toLocaleString('en-IN');
    return p.length > 1 ? whole + '.' + p[1] : whole;
  }
  function unitText(u) { return u === 'unit' ? 'units' : (u || ''); }
  function fmtDate(v) {
    try { return new Date(v + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
    catch (e) { return v; }
  }
  function row() { return pages[cur].rows[sel]; }
  function decimals(r) { return r.type === 'meter' ? 2 : (r.unit === 'nos' ? 0 : 3); }

  /* ---------- meter figures ---------- */
  function meterInfo(r) {
    var v = vals[r.key];
    if (v === '' || v == null || r.last == null) return null;
    var d = Math.round((Number(v) - r.last) * 100) / 100;
    return { units: d, low: d < 0, hi: d > 0 && r.avg7 > 0 && d > 2 * r.avg7 };
  }
  function needsNote(r) {
    var m = r.type === 'meter' && meterInfo(r);
    return !!(m && m.low && !RESET.test(notes[r.id] || ''));
  }

  /* ---------- build ---------- */
  function build(res) {
    var byPage = {};
    (res.items || []).forEach(function (it) {
      if (it.daily === 'coconut-log') return;   // the coconut page has its own three rows
      var r = { key: it.id, id: it.id, en: it.en, ta: it.ta, unit: it.unit, type: it.daily === 'reading' ? 'meter' : 'item' };
      if (r.type === 'meter') {
        var m = (res.meters || {})[it.id] || {};
        r.last = m.last == null ? null : Number(m.last);
        r.avg7 = Number(m.avg7) || 0;
        r.prev = r.last;
        vals[r.key] = m.saved ? String(m.saved.reading) : '';
        notes[r.id] = m.saved ? m.saved.note || '' : '';
      } else {
        r.prev = res.prev && res.prev[it.id] != null ? Number(res.prev[it.id]) : null;
        vals[r.key] = res.saved && res.saved[it.id] != null ? String(res.saved[it.id]) : '';
      }
      (byPage[it.page] = byPage[it.page] || []).push(r);
    });
    var cp = res.coconut && res.coconut.prev, cs = res.coconut && res.coconut.saved;
    byPage.coconut = COCO.map(function (c) {
      vals[c.key] = cs ? String(cs[c.field]) : '';
      return { key: c.key, en: c.en, ta: c.ta, unit: c.unit, type: 'coco', field: c.field, prev: cp ? Number(cp[c.field]) : null };
    }).concat(byPage.coconut || []);
    pages = (res.pages || []).map(function (p) { return { key: p.key, en: p.en, ta: p.ta, rows: byPage[p.key] || [] }; })
      .filter(function (p) { return p.rows.length; });
    cur = 0; sel = 0; fresh = true;
    $('chips').innerHTML = pages.map(function (p, i) {
      return '<button type="button" class="chip" role="tab" data-p="' + i + '"><b>' + esc(p.en) + '</b><small lang="ta">' + esc(p.ta) + '</small></button>';
    }).join('');
  }

  function rowHtml(r, i) {
    var v = vals[r.key];
    var isSel = i === sel;
    var caret = isSel ? '<span class="caret" aria-hidden="true"></span>' : '';
    var amt = v === '' ? '<span class="amt empty">—' + caret + '</span>'
      : '<span class="amt">' + fmtRaw(v) + (r.type === 'meter' ? '' : '<span class="u">' + esc(unitText(r.unit)) + '</span>') + caret + '</span>';
    var sub = '';
    if (r.type === 'meter') {
      var m = meterInfo(r);
      sub = '<span class="prev">' + (r.last == null ? '—' : fmtNum(r.last)) + '</span>';
      if (m) sub += '<span class="units' + (m.low ? ' low' : (m.hi ? ' hi' : '')) + '">' + (m.units >= 0 ? '+' : '') + fmtNum(m.units) + ' units</span>';
    } else {
      sub = '<span class="prev">' + (r.prev == null ? '—' : fmtNum(r.prev) + ' ' + esc(unitText(r.unit))) + '</span>';
    }
    var html = '<div class="item"><button type="button" class="row' + (needsNote(r) && r.showBad ? ' bad' : '') + '" data-i="' + i + '" aria-pressed="' + isSel + '" aria-label="' + esc(r.en) + '">' +
      '<span class="lab"><b>' + esc(r.en) + '</b><small lang="ta">' + esc(r.ta) + '</small></span>' +
      '<span class="fig">' + amt + sub + '</span></button>';
    if (r.type === 'meter' && meterInfo(r) && meterInfo(r).low) {
      html += '<label class="note"><span>Note · குறிப்பு</span><input type="text" data-note="' + esc(r.id) + '" value="' + esc(notes[r.id] || '') + '" autocomplete="off"></label>';
    }
    return html + '</div>';
  }

  function message(t) { $('list').innerHTML = '<div class="msg">' + esc(t) + '</div>'; }

  function paint(keepScroll) {
    $('saveBtn').disabled = saving || loading || !ready;
    if (!ready) return;
    var p = pages[cur];
    var list = $('list');
    var top = list.scrollTop;
    var focusNote = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-note');
    list.innerHTML = p.rows.map(rowHtml).join('');
    if (keepScroll) list.scrollTop = top;
    if (focusNote) { var inp = list.querySelector('[data-note="' + focusNote + '"]'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } }
    $('chips').querySelectorAll('.chip').forEach(function (c, i) { c.setAttribute('aria-selected', i === cur ? 'true' : 'false'); });
    $('dotKey').disabled = decimals(row()) === 0;
    $('saveText').textContent = saving ? 'Saving…' : 'Save usage';
  }
  function select(i, scroll) {
    if (!ready) return;
    sel = i; fresh = true;
    paint(true);
    if (scroll) {
      var el = $('list').querySelectorAll('.row')[sel];
      if (el) { try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { el.scrollIntoView(); } }
    }
  }
  function goPage(i, rowIdx) {
    cur = i; sel = rowIdx || 0; fresh = true;
    $('list').scrollTop = 0;
    paint(false);
    var chip = $('chips').querySelectorAll('.chip')[cur];
    if (chip) { try { chip.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' }); } catch (e) {} }
    if (rowIdx) select(rowIdx, true);
  }

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.row');
    if (b) select(Number(b.getAttribute('data-i')), false);
  });
  $('list').addEventListener('input', function (e) {
    var id = e.target.getAttribute('data-note');
    if (!id) return;
    notes[id] = e.target.value;
    var r = pages[cur].rows.filter(function (x) { return x.id === id; })[0];
    if (r && !needsNote(r)) r.showBad = false;
  });
  $('chips').addEventListener('click', function (e) {
    var c = e.target.closest('.chip');
    if (c && ready) goPage(Number(c.getAttribute('data-p')), 0);
  });

  /* ---------- keypad ---------- */
  function next() {
    if (sel + 1 < pages[cur].rows.length) { select(sel + 1, true); return; }
    goPage((cur + 1) % pages.length, 0);
  }
  function prevRow() {
    if (sel > 0) { select(sel - 1, true); return; }
    if (cur > 0) goPage(cur - 1, pages[cur - 1].rows.length - 1);
  }
  function press(k) {
    if (!ready || saving) return;
    $('saveErr').textContent = '';
    var r = row();
    var v = vals[r.key];
    if (k === 'next') { next(); return; }
    if (k === 'same') {
      if (r.prev == null) return;
      vals[r.key] = String(r.prev);
      fresh = true;
      paint(true);
      return;
    }
    if (k === 'del') {
      vals[r.key] = fresh ? '' : v.slice(0, -1);
      fresh = false;
      paint(true);
      return;
    }
    var base = fresh ? '' : v;
    var nv;
    if (k === '.') {
      if (decimals(r) === 0 || base.indexOf('.') !== -1) return;
      nv = (base === '' ? '0' : base) + '.';
    } else {
      nv = (base + k).replace(/^0+(?=\d)/, '');
      var parts = nv.split('.');
      if (parts[0].length > 9) return;
      if (parts.length > 1 && parts[1].length > decimals(r)) return;
    }
    vals[r.key] = nv;
    fresh = false;
    paint(true);
  }
  $('pad').addEventListener('click', function (e) {
    var b = e.target.closest('.key');
    if (b && !b.disabled) press(b.getAttribute('data-k'));
  });
  document.addEventListener('keydown', function (e) {
    if (LS.locked() || !$('done').hidden || e.target.tagName === 'INPUT') return;
    if (/^[0-9]$/.test(e.key) || e.key === '.') { press(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === 'ArrowDown') { press('next'); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { prevRow(); e.preventDefault(); }
  });

  /* ---------- load a date ---------- */
  async function load() {
    var day = $('day').value;
    $('saveErr').textContent = '';
    if (!day || day > todayStr) { ready = false; $('chips').innerHTML = ''; message('Pick a date that is not in the future'); paint(); return; }
    var seq = ++loadSeq;
    loading = true; ready = false;
    message('Loading…');
    paint();
    try {
      var res = await LS.call('getUsage', { date: day });
      if (seq !== loadSeq) return;
      vals = {}; notes = {};
      build(res);
      ready = pages.length > 0;
      if (!ready) message('No items');
    } catch (err) {
      if (seq !== loadSeq) return;
      if (LS.handle(err)) return;
      message(LS.errText(err));
    } finally {
      if (seq === loadSeq) { loading = false; paint(); }
    }
  }
  $('day').addEventListener('change', load);

  /* ---------- save ---------- */
  function findFirst(test) {
    for (var p = 0; p < pages.length; p++) for (var i = 0; i < pages[p].rows.length; i++) if (test(pages[p].rows[i])) return { p: p, i: i };
    return null;
  }
  $('saveBtn').addEventListener('click', async function () {
    if (saving || loading || !ready) return;
    $('saveErr').textContent = '';
    var day = $('day').value;
    if (!day || day > todayStr) { $('day').focus(); $('live').textContent = 'Pick a date that is not in the future'; return; }
    var empty = findFirst(function (r) { return vals[r.key] === '' || vals[r.key] == null || /\.$/.test(vals[r.key]); });
    if (empty) { goPage(empty.p, empty.i); $('live').textContent = 'Fill this row'; return; }
    var low = findFirst(needsNote);
    if (low) {
      pages[low.p].rows[low.i].showBad = true;
      goPage(low.p, low.i);
      $('saveErr').textContent = 'The reading is lower than the last one. Write in the note if the meter was reset or replaced.';
      var inp = $('list').querySelector('[data-note]');
      if (inp) inp.focus();
      return;
    }
    var items = [], meters = [], coconut = {};
    pages.forEach(function (p) {
      p.rows.forEach(function (r) {
        if (r.type === 'item') items.push({ item_id: r.id, qty: vals[r.key] });
        else if (r.type === 'meter') meters.push({ item_id: r.id, reading: vals[r.key], note: meterInfo(r) && meterInfo(r).low ? (notes[r.id] || '') : '' });
        else coconut[r.field] = vals[r.key];
      });
    });
    saving = true; paint(true);
    try {
      var res = await LS.call('saveUsage', { date: day, items: items, meters: meters, coconut: coconut });
      $('dDate').textContent = fmtDate(res.date);
      $('dPages').innerHTML = pages.map(function (p) {
        return '<div class="card"><h3>' + esc(p.en) + ' <small lang="ta">' + esc(p.ta) + '</small></h3>' + p.rows.map(function (r) {
          var v = '<span class="num">' + fmtNum(vals[r.key]) + ' ' + esc(unitText(r.unit)) + '</span>';
          if (r.type === 'meter') {
            var u = res.meters ? res.meters[r.id] : '';
            v = '<span class="num">' + fmtNum(vals[r.key]) + '</span>' + (u === '' || u == null ? '' : '<small class="num">+' + fmtNum(u) + ' units</small>');
          }
          return '<div class="c-row"><span class="k">' + esc(r.en) + '</span><span class="v">' + v + '</span></div>';
        }).join('') + '</div>';
      }).join('');
      ['head', 'chips', 'list', 'bottom'].forEach(function (id) { $(id).hidden = true; });
      $('done').hidden = false;
      $('doneTitle').focus();
    } catch (err) {
      if (LS.handle(err)) return;
      $('saveErr').textContent = LS.errText(err);
    } finally {
      saving = false; paint(true);
    }
  });
  $('editBtn').addEventListener('click', function () {
    $('done').hidden = true;
    ['head', 'chips', 'list', 'bottom'].forEach(function (id) { $(id).hidden = false; });
    select(sel, true);
  });

  paint();
  LS.start({ page: 'usage', onLogin: load });
})();
</script>
