<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15130F">
<title>LS Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F2B33D'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='28' fill='%231F1606'%3ELS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#15130F; --surface:#201D18; --surface2:#2A261F; --line:#3A342B;
  --text:#F4EFE6; --dim:#B5AC9C; --faint:#9C9384;
  --gold:#F2B33D; --ink:#1F1606; --mint:#6FD3A4;
  --num:'Space Grotesk','Hind Madurai',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:#0E0C09}
body{margin:0;color:var(--text);font-family:'Hind Madurai',system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:640px){
  .app{margin:32px auto;min-height:auto;border-radius:32px;box-shadow:0 0 0 1px #2A261F,0 30px 80px rgba(0,0,0,.5)}
}

/* header */
.top{padding:28px 20px 8px;display:flex;align-items:center;gap:14px}
.logo{flex:none;width:56px;height:56px;border-radius:16px;background:var(--gold);color:var(--ink);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:22px;letter-spacing:.02em}
.title{display:flex;flex-direction:column;min-width:0}
h1{margin:0;font-family:var(--num);font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.ta-sub{margin:0;font-size:16px;color:var(--dim)}
.today{margin:0;padding:0 20px;font-size:14px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:8px}
.today i{width:8px;height:8px;border-radius:99px;background:var(--gold)}

/* sections */
main{padding:20px 20px 28px;display:flex;flex-direction:column;gap:26px;flex:1}
section{display:flex;flex-direction:column;gap:10px}
.sec{margin:0;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--dim)}
.sec .ta{font-weight:500;font-size:13px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 10px}

/* link tiles */
.tile{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px 16px;border-radius:20px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--text);text-decoration:none;transition:box-shadow .15s,background .15s}
.tile:hover{box-shadow:inset 0 0 0 1.5px var(--faint)}
.tile:active{background:var(--surface2);transform:translateY(1px)}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ico{flex:none;width:52px;height:52px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;color:var(--gold)}
.ico.kitchen{color:var(--mint)}
.txt{display:flex;flex-direction:column;min-width:0;flex:1}
.t{font-family:var(--num);font-size:19px;font-weight:600;line-height:1.25}
.txt .ta{font-size:14px;color:var(--dim)}
.go{flex:none;color:var(--faint)}

footer{padding:0 20px calc(24px + env(safe-area-inset-bottom));font-size:14px;color:var(--faint)}
footer p{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none !important}.tile:active{transform:none}}
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="logo" aria-hidden="true">LS</div>
  <div class="title">
    <h1>LS Log</h1>
    <p class="ta-sub" lang="ta">தினசரி பதிவுகள்</p>
  </div>
</header>
<p class="today"><i aria-hidden="true"></i><span id="today">Today</span></p>

<main>

  <section aria-labelledby="kitchenHead">
    <h2 class="sec" id="kitchenHead">
      <span>Kitchen</span><span class="ta" lang="ta">சமையலறை</span>
      <span class="pill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>All staff</span>
    </h2>
    <a class="tile" href="coconut.html">
      <span class="ico kitchen" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10h19a9.5 9.5 0 0 1-19 0z"></path><path d="M6.5 10a5.5 5.5 0 0 0 11 0"></path><path d="M12 6.5c.6-1.9 2.1-3 4-3.2M12 6.5c-.6-1.6-1.9-2.6-3.5-2.8"></path></svg>
      </span>
      <span class="txt">
        <span class="t">Coconut Daily Log</span>
        <span class="ta" lang="ta">தேங்காய் தினசரி கணக்கு</span>
      </span>
      <svg class="go" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </section>

  <section aria-labelledby="ownerHead">
    <h2 class="sec" id="ownerHead">
      <span>Owner</span><span class="ta" lang="ta">உரிமையாளர்</span>
      <span class="pill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Owner only</span>
    </h2>
    <a class="tile" href="vendor.html">
      <span class="ico" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5h11v10h-11z"></path><path d="M13.5 9.5h4l3.5 3.5v3.5h-7.5"></path><circle cx="6.5" cy="17.5" r="2" fill="#2A261F"></circle><circle cx="17" cy="17.5" r="2" fill="#2A261F"></circle></svg>
      </span>
      <span class="txt">
        <span class="t">Add vendor</span>
        <span class="ta" lang="ta">புதிய விற்பனையாளர்</span>
      </span>
      <svg class="go" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a class="tile" href="staff.html">
      <span class="ico" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="3.5"></circle><path d="M3.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"></path><path d="M19 8v6M16 11h6"></path></svg>
      </span>
      <span class="txt">
        <span class="t">Add staff</span>
        <span class="ta" lang="ta">புதிய பணியாளர்</span>
      </span>
      <svg class="go" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </section>

</main>

<footer>
  <p>Every page asks for your own PIN each time it opens, so each entry is saved under your name.</p>
</footer>

</div>
<script>
(function () {
  try {
    document.getElementById('today').textContent =
      new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
  } catch (e) {}
})();
</script>
</body>
</html>
