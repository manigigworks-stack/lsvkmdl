<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coconut Daily Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#15130F">
<style>
:root{
  /* LS theme: same dark palette and fonts as the vendor, staff, bill, payment, salary and sales screens */
  --bg:#15130F;
  --surface:#201D18;
  --ink:#F4EFE6;
  --muted:#B5AC9C;
  --palm:#F2B33D;
  --shell:#FFD27A;
  --line:#3A342B;
  --soft:#2A261F;
  --on-palm:#1F1606;
  --bad:#FF8F73;
  --ok:#6FD3A4;
  --font-display:"Space Grotesk","Hind Madurai",system-ui,sans-serif;
  --font-body:"Hind Madurai","Noto Sans Tamil","Latha","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:#0E0C09}
body{margin:0;background:#0E0C09;color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);padding:28px 20px 40px;display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.app{margin:32px auto;min-height:auto;border-radius:32px;box-shadow:0 0 0 1px #2A261F,0 30px 80px rgba(0,0,0,.5)}}

header{display:flex;align-items:flex-start;gap:14px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.eyebrow i{width:8px;height:8px;border-radius:99px;background:var(--palm)}
.title{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-0.01em}
.ta{color:var(--muted);font-size:15px}
.title > .ta{font-size:17px}
a.lock{display:inline-flex;align-items:center;text-decoration:none}
.lock + .lock{margin-left:-6px}
.lock{margin-left:auto;flex:none;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer}

.who{margin:-4px 0 0;font-size:15px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;margin:0}

.card{background:var(--surface);border:0;border-radius:22px;padding:18px 16px;display:flex;flex-direction:column;gap:22px}

/* PIN screen */
.pin-head{display:flex;flex-direction:column;gap:2px;text-align:center}
.pin-head .en{font-weight:600;font-size:19px}
.pin-head .ta{font-size:14px}
.dots{display:flex;gap:14px;justify-content:center}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);background:transparent}
.dot.on{background:var(--palm);border-color:var(--palm)}
.dots.wrong .dot{border-color:var(--bad)}
@media (prefers-reduced-motion: no-preference){
  .dots.wrong{animation:shake .35s ease-in-out}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
}
.pin-msg{margin:0;min-height:1.45em;text-align:center;font-size:15px;color:var(--muted)}
.pin-msg.bad{color:var(--bad);font-weight:500}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:64px;border-radius:16px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--soft);color:var(--ink);font-family:var(--font-display);font-size:28px;font-weight:600;cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums}
.key.word{font-family:var(--font-body);font-size:16px}
.key:active{transform:scale(0.97)}
.key:disabled{opacity:.5;cursor:default}

/* Entry form */
.field{display:flex;flex-direction:column;gap:8px}
.field-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field label{display:flex;flex-direction:column;gap:0}
.field label .en{font-weight:600;font-size:17px}
.field label .ta{font-size:14px}

.chip{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--palm);white-space:nowrap}
.chip.past{color:var(--shell)}

input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;width:100%}
input:focus{border-color:var(--palm)}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(.8);cursor:pointer}
::placeholder{color:#9C9384;opacity:1}
input:focus-visible,button:focus-visible{outline:3px solid var(--palm);outline-offset:2px}
input[type="date"]{height:52px;padding:0 14px;font-size:18px}

.status{margin:0;font-size:14px;color:var(--muted)}
.status.exists{color:var(--shell);font-weight:500}
.status.bad{color:var(--bad);font-weight:500}

.big{height:68px;font-family:var(--font-display);font-weight:600;font-size:36px;text-align:center;font-variant-numeric:tabular-nums;padding:0 8px;-moz-appearance:textfield}
.big::-webkit-outer-spin-button,.big::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.stepper{display:grid;grid-template-columns:68px 1fr 68px;gap:10px}
.step{height:68px;border-radius:14px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--soft);color:var(--ink);font-size:32px;font-weight:600;cursor:pointer;touch-action:manipulation}
.step:active{transform:scale(0.97)}

.unit-input{position:relative}
.unit-input .big{padding-right:56px;color:var(--shell)}
.unit{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-weight:600;font-size:18px;color:var(--muted);pointer-events:none}

.hint{margin:0;font-size:14px;color:var(--muted);min-height:1.45em;font-variant-numeric:tabular-nums}
.err{margin:0;font-size:14px;color:var(--bad);font-weight:500}
.err:empty{display:none}
input.invalid{border-color:var(--bad)}

.save{height:60px;border:0;border-radius:16px;background:var(--palm);color:var(--on-palm);font:inherit;font-weight:700;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation}
.save .ta{color:inherit;opacity:.85;font-size:16px}
.save:disabled{opacity:.6;cursor:progress}

.saved h2{font-family:var(--font-display);font-size:26px;font-weight:600;margin:0;color:var(--ok)}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--soft)}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--soft)}
.row .k{color:var(--muted)}
.row .v{font-family:var(--font-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.ghost{height:56px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:17px;cursor:pointer}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.step:active,.key:active{transform:none}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="title">
      <div class="eyebrow"><i aria-hidden="true"></i>LS · Coconut</div>
      <h1>Coconut Daily Log</h1>
      <span class="ta">தேங்காய் தினசரி கணக்கு</span>
    </div>
    <a class="lock homelink" href="index.html">Home</a>
    <button type="button" class="lock" id="lock-btn" hidden>Lock</button>
  </header>

  <p class="who" id="who-bar" hidden>Saving as <b id="who-name"></b></p>

  <p class="note" id="mode-note" hidden>Preview</p>

  <!-- PIN screen -->
  <section class="card" id="login-view" aria-labelledby="pin-title">
    <div class="pin-head">
      <span class="en" id="pin-title">Enter PIN</span>
      <span class="ta">PIN எண்ணை உள்ளிடுங்கள்</span>
    </div>
    <div class="dots" id="dots" aria-hidden="true">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <p class="pin-msg" id="pin-msg" role="status" aria-live="polite"></p>
    <div class="keypad" id="keypad">
      <button type="button" class="key" data-key="1">1</button>
      <button type="button" class="key" data-key="2">2</button>
      <button type="button" class="key" data-key="3">3</button>
      <button type="button" class="key" data-key="4">4</button>
      <button type="button" class="key" data-key="5">5</button>
      <button type="button" class="key" data-key="6">6</button>
      <button type="button" class="key" data-key="7">7</button>
      <button type="button" class="key" data-key="8">8</button>
      <button type="button" class="key" data-key="9">9</button>
      <button type="button" class="key word" data-key="clear">Clear</button>
      <button type="button" class="key" data-key="0">0</button>
      <button type="button" class="key word" data-key="back" aria-label="Delete last digit">⌫</button>
    </div>
  </section>

  <!-- Entry form -->
  <form class="card" id="form" novalidate hidden>
    <div class="field">
      <div class="field-head">
        <label for="date"><span class="en">Date</span><span class="ta">தேதி</span></label>
        <span class="chip" id="day-chip">Today</span>
      </div>
      <input type="date" id="date" name="date" required>
      <p class="status" id="date-status" aria-live="polite"></p>
      <p class="err" id="date-err" aria-live="polite"></p>
    </div>

    <div class="field">
      <label for="loadin"><span class="en">Coconuts loaded in <span class="day-word">today</span></span><span class="ta">வந்த தேங்காய் (எண்ணிக்கை)</span></label>
      <div class="stepper">
        <button type="button" class="step" data-target="loadin" data-step="-1" aria-label="One loaded-in coconut less">−</button>
        <input class="big" type="number" id="loadin" name="loadin" inputmode="numeric" min="0" step="1" placeholder="0" required>
        <button type="button" class="step" data-target="loadin" data-step="1" aria-label="One loaded-in coconut more">+</button>
      </div>
      <p class="err" id="loadin-err" aria-live="polite"></p>
    </div>

    <div class="field">
      <label for="count"><span class="en">Coconuts used <span class="day-word">today</span></span><span class="ta">பயன்படுத்திய தேங்காய் (எண்ணிக்கை)</span></label>
      <div class="stepper">
        <button type="button" class="step" data-target="count" data-step="-1" aria-label="One used coconut less">−</button>
        <input class="big" type="number" id="count" name="count" inputmode="numeric" min="0" step="1" placeholder="0" required>
        <button type="button" class="step" data-target="count" data-step="1" aria-label="One used coconut more">+</button>
      </div>
      <p class="err" id="count-err" aria-live="polite"></p>
    </div>

    <div class="field">
      <label for="damage"><span class="en">Coconuts damaged <span class="day-word">today</span></span><span class="ta">சேதமான தேங்காய் (எண்ணிக்கை)</span></label>
      <div class="stepper">
        <button type="button" class="step" data-target="damage" data-step="-1" aria-label="One damaged coconut less">−</button>
        <input class="big" type="number" id="damage" name="damage" inputmode="numeric" min="0" step="1" placeholder="0" required>
        <button type="button" class="step" data-target="damage" data-step="1" aria-label="One damaged coconut more">+</button>
      </div>
      <p class="err" id="damage-err" aria-live="polite"></p>
    </div>

    <div class="field">
      <label for="shell"><span class="en">Coconut shell weight</span><span class="ta">தேங்காய் ஓடு எடை</span></label>
      <div class="unit-input">
        <input class="big" type="number" id="shell" name="shell" inputmode="decimal" min="0" step="0.1" placeholder="0.0" required>
        <span class="unit">kg</span>
      </div>
      <p class="hint" id="ratio" aria-live="polite"></p>
      <p class="err" id="shell-err" aria-live="polite"></p>
    </div>

    <button type="submit" class="save" id="save-btn"><span id="save-label">Save</span><span class="ta">சேமி</span></button>
    <p class="err" id="save-err" aria-live="polite"></p>
  </form>

  <!-- Saved confirmation -->
  <section class="card saved" id="saved" aria-live="polite" hidden>
    <h2 id="saved-title">Saved to sheet</h2>
    <div class="rows">
      <div class="row"><span class="k">Date</span><span class="v" id="s-date"></span></div>
      <div class="row"><span class="k">Coconuts loaded in</span><span class="v" id="s-loadin"></span></div>
      <div class="row"><span class="k">Coconuts used</span><span class="v" id="s-count"></span></div>
      <div class="row"><span class="k">Coconuts damaged</span><span class="v" id="s-damage"></span></div>
      <div class="row"><span class="k">Shell weight</span><span class="v" id="s-shell"></span></div>
      <div class="row"><span class="k">Saved by</span><span class="v" id="s-by"></span></div>
    </div>
    <button type="button" class="ghost" id="again">Back to log</button>
  </section>
</main>

<script src="config.js"></script>
<script>
const API_URL = (window.LS_CONFIG && window.LS_CONFIG.apiUrl) || 'PASTE-EXEC-LINK';   // set in config.js

(function(){
  const $ = id => document.getElementById(id);
  const PIN_LENGTH = 6;
  const MOCK = window.__COCONUT_MOCK__ || null;   // preview only
  const API_READY = !!MOCK || /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(API_URL);
  if (window.__COCONUT_PREVIEW__) $('mode-note').hidden = false;

  const PIN_KEY = 'ls-coconut-pin';

  /* ---------- login from the home screen ---------- */
  // The home screen (index.html) keeps the PIN for this browser tab only, so this page opens without asking again.
  // It is cleared by Lock, by closing the tab, or after 12 hours.
  var SESSION_KEY = 'ls-session', SESSION_HOURS = 12;
  function readSession() {
    try {
      var s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
      if (s && s.pin && s.until > Date.now()) return s;
      sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {}
    return null;
  }
  function writeSession(p, who) {
    try {
      var old = readSession(), same = old && old.pin === p;
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({
        pin: p, name: who.name, role: who.role,
        pages: same ? (old.pages || []) : [],
        until: same ? old.until : Date.now() + SESSION_HOURS * 3600 * 1000
      }));
    } catch (e) {}
  }
  function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
  // On the website Lock goes back to the home screen. The preview has no home screen next to it, so it stays here.
  function goHome() { if (MOCK) return false; window.location.href = 'index.html'; return true; }
  if (window.__LS_HOME__) document.querySelectorAll('.homelink').forEach(function (a) { a.href = window.__LS_HOME__; a.target = '_blank'; a.rel = 'noopener'; });
  const form = $('form'), dateEl = $('date');
  const fields = {date: dateEl, loadin: $('loadin'), count: $('count'), damage: $('damage'), shell: $('shell')};
  const saveBtn = $('save-btn'), saveLabel = $('save-label');

  let pin = '', typed = '', pinBusy = false;
  let loadToken = 0, fromServer = false, edited = false, hasEntry = false;

  /* ---------- helpers ---------- */
  // The PIN is asked every time the page opens and is never stored on the phone.
  try { localStorage.removeItem(PIN_KEY); } catch (e) {}   // clears a PIN saved by the older version
  let me = null;   // who is logged in: {name, role}

  // Sends a request to the Apps Script (Code.gs) and returns its data.
  // No Google sign-in is sent (credentials: 'omit'), so several logged-in Google accounts don't matter.
  async function call(action, payload){
    const body = Object.assign({action: action}, payload || {});
    if (MOCK) return MOCK(body);
    if (!API_READY) throw new Error('This page is not connected yet: add the Apps Script link in config.js.');
    let res;
    try {
      const r = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(body),
        credentials: 'omit',
        redirect: 'follow'
      });
      res = await r.json();
    } catch (e) {
      throw new Error('Could not reach the sheet. Check the internet and try again.');
    }
    if (!res || res.ok !== true) throw new Error((res && res.error) || 'Something went wrong. Try again.');
    return res.data;
  }
  function errText(err){
    const m = (err && err.message) ? err.message : String(err || '');
    return m.replace(/^(Exception|Error):\s*/i, '') || 'Something went wrong. Try again.';
  }
  const isPinError = err => /PIN/.test(errText(err));

  function isoToday(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function niceDate(iso){
    const [y,m,d] = iso.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
  }

  /* ---------- PIN screen ---------- */
  function setPinMsg(text, bad){ const el = $('pin-msg'); el.textContent = text; el.classList.toggle('bad', !!bad); }
  function renderDots(){ document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i < typed.length)); }
  function wrongShake(){
    const dots = $('dots');
    dots.classList.remove('wrong'); void dots.offsetWidth; dots.classList.add('wrong');
  }
  function setKeypad(enabled){ document.querySelectorAll('.key').forEach(k => { k.disabled = !enabled; }); }

  function pressKey(k){
    if (pinBusy) return;
    if (k === 'back') typed = typed.slice(0, -1);
    else if (k === 'clear') typed = '';
    else if (typed.length < PIN_LENGTH) typed += k;
    $('dots').classList.remove('wrong');
    setPinMsg('');
    renderDots();
    if (typed.length === PIN_LENGTH) tryPin(typed);
  }

  async function tryPin(p, quiet){
    pinBusy = true; setKeypad(false); setPinMsg(quiet ? 'Opening…' : 'Checking…');
    try {
      const who = await call('login', {pin: p, page: 'coconut'});
      pin = p;
      writeSession(p, who);
      typed = ''; renderDots(); setPinMsg('');
      showApp(who);
    } catch (err) {
      typed = ''; renderDots();
      if (!quiet) wrongShake();
      if (/Wrong PIN/.test(errText(err))) clearSession();
      setPinMsg(errText(err), true);
    } finally {
      pinBusy = false; setKeypad(true);
    }
  }

  document.querySelectorAll('.key').forEach(b => b.addEventListener('click', () => pressKey(b.dataset.key)));
  document.addEventListener('keydown', e => {
    if ($('login-view').hidden) return;
    if (/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if (e.key === 'Backspace') pressKey('back');
    else if (e.key === 'Escape') pressKey('clear');
  });

  function showLogin(message, bad){
    pin = ''; me = null; $('who-bar').hidden = true;
    typed = ''; renderDots();
    form.hidden = true; $('saved').hidden = true; $('lock-btn').hidden = true;
    $('login-view').hidden = false;
    setPinMsg(message || '', bad);
  }

  function showApp(who){
    me = who || me;
    if (me && me.name){ $('who-name').textContent = me.name; $('who-bar').hidden = false; }
    $('login-view').hidden = true; $('saved').hidden = true;
    form.hidden = false; $('lock-btn').hidden = false;
    resetForm();
  }

  $('lock-btn').addEventListener('click', () => { clearSession(); if (goHome()) return; showLogin('Locked. Enter the PIN to continue.'); });

  /* ---------- entry form ---------- */
  function setDayWord(t){ document.querySelectorAll('.day-word').forEach(el => { el.textContent = t; }); }
  function syncDay(){
    const v = dateEl.value, chip = $('day-chip');
    if (!v || v === isoToday()){ chip.textContent = 'Today'; chip.classList.remove('past'); setDayWord('today'); }
    else { chip.textContent = 'Earlier day'; chip.classList.add('past'); setDayWord('on ' + niceDate(v)); }
  }
  function setStatus(text, kind){ const el = $('date-status'); el.textContent = text; el.className = 'status' + (kind ? ' ' + kind : ''); }

  function updateRatio(){
    const c = parseInt(fields.count.value, 10), s = parseFloat(fields.shell.value);
    $('ratio').textContent = (c > 0 && s > 0) ? 'About ' + Math.round(s / c * 1000) + ' g of shell per coconut used' : '';
  }
  function setErr(name, msg){
    $(name + '-err').textContent = msg;
    if (fields[name]) fields[name].classList.toggle('invalid', !!msg);
  }
  function clearErrs(){ Object.keys(fields).forEach(n => setErr(n, '')); setErr('save', ''); }

  function fill(e){
    fields.loadin.value = e.coconutsIn; fields.count.value = e.coconutsUsed;
    fields.damage.value = e.coconutsDamaged; fields.shell.value = e.shellKg;
    clearErrs(); updateRatio();
  }
  function clearNumbers(){
    ['loadin','count','damage','shell'].forEach(n => { fields[n].value = ''; });
    clearErrs(); updateRatio();
  }

  async function loadEntry(){
    const d = dateEl.value;
    if (!d || d > isoToday()){ setStatus(''); return; }
    const mine = ++loadToken;
    setStatus('Checking this day…');
    try {
      const e = await call('getEntry', {pin: pin, date: d});
      if (mine !== loadToken) return;
      if (e){
        if (!edited || fromServer){ fill(e); fromServer = true; edited = false; }
        hasEntry = true;
        setStatus('Already saved' + (e.savedAt ? ' at ' + e.savedAt : '') + (e.savedBy ? ' by ' + e.savedBy : '') + '. Saving again will update it.', 'exists');
      } else {
        if (fromServer){ clearNumbers(); }
        fromServer = false; edited = false; hasEntry = false;
        setStatus('No entry yet for this day.');
      }
      saveLabel.textContent = hasEntry ? 'Update' : 'Save';
    } catch (err) {
      if (mine !== loadToken) return;
      if (isPinError(err)) { if (/Wrong PIN/.test(errText(err))) clearSession(); showLogin(errText(err), true); return; }
      setStatus(errText(err), 'bad');
    }
  }

  function resetForm(){
    form.reset();
    dateEl.value = isoToday(); dateEl.max = isoToday();
    fromServer = false; edited = false; hasEntry = false;
    clearErrs(); syncDay(); updateRatio();
    saveLabel.textContent = 'Save';
    loadEntry();
  }

  function validate(){
    let ok = true;
    const today = isoToday();
    if (!dateEl.value){ setErr('date', 'Pick a date.'); ok = false; }
    else if (dateEl.value > today){ setErr('date', 'Pick today or an earlier date.'); ok = false; }
    else setErr('date', '');

    const counts = [
      ['loadin', 'Enter 0 if no coconuts came in.', 'Use a whole number, like 200.'],
      ['count', 'Enter how many coconuts were used.', 'Use a whole number, like 120.'],
      ['damage', 'Enter 0 if no coconuts were damaged.', 'Use a whole number, like 3.']
    ];
    counts.forEach(([name, emptyMsg, badMsg]) => {
      const raw = fields[name].value.trim();
      if (raw === ''){ setErr(name, emptyMsg); ok = false; }
      else if (!/^\d+$/.test(raw)){ setErr(name, badMsg); ok = false; }
      else setErr(name, '');
    });

    const sRaw = fields.shell.value.trim();
    if (sRaw === ''){ setErr('shell', 'Enter the shell weight in kg.'); ok = false; }
    else if (isNaN(parseFloat(sRaw)) || parseFloat(sRaw) < 0){ setErr('shell', 'Enter the weight as a number, like 21.5.'); ok = false; }
    else setErr('shell', '');

    if (!ok){ const first = form.querySelector('input.invalid'); if (first) first.focus(); }
    return ok;
  }

  document.querySelectorAll('.step').forEach(btn => btn.addEventListener('click', () => {
    const name = btn.dataset.target, el = fields[name];
    const v = parseInt(el.value || '0', 10) || 0;
    el.value = Math.max(0, v + Number(btn.dataset.step));
    edited = true; setErr(name, ''); updateRatio();
  }));
  ['loadin','count','damage','shell'].forEach(n => fields[n].addEventListener('input', () => { edited = true; setErr(n, ''); updateRatio(); }));
  dateEl.addEventListener('change', () => { setErr('date', ''); syncDay(); loadEntry(); });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    setErr('save', '');
    if (!validate()) return;
    const entry = {
      date: dateEl.value,
      coconutsIn: parseInt(fields.loadin.value, 10),
      coconutsUsed: parseInt(fields.count.value, 10),
      coconutsDamaged: parseInt(fields.damage.value, 10),
      shellKg: Math.round(parseFloat(fields.shell.value) * 100) / 100
    };
    const label = saveLabel.textContent;
    saveBtn.disabled = true; saveLabel.textContent = 'Saving…';
    try {
      const res = await call('saveEntry', {pin: pin, entry: entry});
      $('saved-title').textContent = (res && res.updated) ? 'Updated in sheet' : 'Saved to sheet';
      $('s-date').textContent = niceDate(entry.date);
      $('s-loadin').textContent = entry.coconutsIn.toLocaleString('en-IN');
      $('s-count').textContent = entry.coconutsUsed.toLocaleString('en-IN');
      $('s-damage').textContent = entry.coconutsDamaged.toLocaleString('en-IN');
      $('s-shell').textContent = entry.shellKg.toLocaleString('en-IN', {maximumFractionDigits:2}) + ' kg';
      $('s-by').textContent = (res && res.by) || (me && me.name) || '';
      form.hidden = true; $('saved').hidden = false;
    } catch (err) {
      if (isPinError(err)) { if (/Wrong PIN/.test(errText(err))) clearSession(); showLogin(errText(err), true); return; }
      setErr('save', errText(err));
    } finally {
      saveBtn.disabled = false; saveLabel.textContent = label;
    }
  });

  $('again').addEventListener('click', () => { $('saved').hidden = true; form.hidden = false; resetForm(); });

  /* ---------- start ---------- */
  if (!API_READY){
    setKeypad(false);
    setPinMsg('This page is not connected yet: add the Apps Script link in config.js.', true);
  } else {
    const s = readSession();
    if (s) tryPin(s.pin, true);
  }
})();
</script>
</body>
</html>
